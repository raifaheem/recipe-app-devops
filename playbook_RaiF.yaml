- hosts: devops_server
  become: yes
  vars:
    k8s_src_dir: "./k8s"
    k8s_dst_dir: "/home/{{ ansible_user }}/k8s"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes APT Release key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Add Kubernetes APT keyring (dearmor)
      command: >
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes APT repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    - name: Create folder for k8s manifests
      file:
        path: "{{ k8s_dst_dir }}"
        state: directory
        mode: "0755"

    - name: Copy k8s manifests to server
      copy:
        src: "{{ k8s_src_dir }}/"
        dest: "{{ k8s_dst_dir }}/"
        mode: "0644"

    # ---- Install lightweight Kubernetes (k3s) ----
    - name: Install k3s (lightweight Kubernetes)
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure k3s service is running
      service:
        name: k3s
        state: started
        enabled: yes

    - name: Wait for Kubernetes API to be ready
      shell: kubectl get nodes
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: k3s_nodes
      retries: 20
      delay: 5
      until: k3s_nodes.rc == 0

    - name: Apply Kubernetes manifests
      command: kubectl apply -f {{ k8s_dst_dir }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: apply_out
      changed_when: "'configured' in apply_out.stdout or 'created' in apply_out.stdout"