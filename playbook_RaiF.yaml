- hosts: devops-server
  become: yes
  vars:
    k8s_src_dir: "./k8s"
    k8s_dst_dir: "/home/{{ ansible_user }}/k8s"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install kubectl
      apt:
        name: kubectl
        state: present

    - name: Create folder for k8s manifests
      file:
        path: "{{ k8s_dst_dir }}"
        state: directory
        mode: "0755"

    - name: Copy k8s manifests to server
      copy:
        src: "{{ k8s_src_dir }}/"
        dest: "{{ k8s_dst_dir }}/"
        mode: "0644"

    - name: Apply Kubernetes manifests
      command: kubectl apply -f {{ k8s_dst_dir }}
      register: apply_out
      changed_when: "'configured' in apply_out.stdout or 'created' in apply_out.stdout"
